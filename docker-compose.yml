version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: trulylied-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: trulylied-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: trulylied-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  python-ai:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    image: trulylied-python-ai:latest
    container_name: trulylied-python-ai
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - MONGO_URI=mongodb://mongo:27017/trulylied
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - mongo
      - redis
      - qdrant
    restart: unless-stopped

  celery-worker:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    image: trulylied-celery-worker:latest
    container_name: trulylied-celery-worker
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info", "-c", "2"]
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - MONGO_URI=mongodb://mongo:27017/trulylied
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - mongo
      - redis
      - qdrant
    restart: unless-stopped

  node-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: trulylied-node-backend:latest
    container_name: trulylied-node-backend
    ports:
      - "8082:8080"
    environment:
      - PYTHON_AI_URL=http://python-ai:8000
      - MONGO_URI=mongodb://mongo:27017/trulylied
      - REDIS_URL=redis://redis:6379/0
      - PORT=8080
    depends_on:
      - python-ai
      - redis
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
  qdrant_data:
